# ─────────────────────────────────────────────────────────────────────────────
# Grafana — Prometheus Datasource Provisioning
# Auto-configured on container start — no manual UI setup required.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
