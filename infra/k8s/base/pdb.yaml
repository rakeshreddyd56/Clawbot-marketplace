# ─────────────────────────────────────────────
# Clawbot Marketplace — PodDisruptionBudgets
# Ensures minimum availability during node maintenance,
# rolling updates, and cluster operations.
# ─────────────────────────────────────────────

# ── api-gateway-bff PDB ───────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-bff
  namespace: clawbot-marketplace
  labels:
    app: api-gateway-bff
    app.kubernetes.io/part-of: clawbot-marketplace
spec:
  # Keep at least 1 pod running during disruptions
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway-bff
---
# ── web-console PDB ───────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-console
  namespace: clawbot-marketplace
  labels:
    app: web-console
    app.kubernetes.io/part-of: clawbot-marketplace
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web-console
---
# ── temporal-worker PDB ───────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: temporal-worker
  namespace: clawbot-marketplace
  labels:
    app: temporal-worker
    app.kubernetes.io/part-of: clawbot-marketplace
spec:
  # Single-replica worker — allow disruption (0 min), but prevents
  # simultaneous eviction with other services
  minAvailable: 0
  selector:
    matchLabels:
      app: temporal-worker
---
# ── policy-decision-service PDB ───────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: policy-decision-service
  namespace: clawbot-marketplace
  labels:
    app: policy-decision-service
    app.kubernetes.io/part-of: clawbot-marketplace
spec:
  # OPA must always have at least 1 instance — policy enforcement cannot lapse
  minAvailable: 1
  selector:
    matchLabels:
      app: policy-decision-service
---
# ── execution-orchestrator PDB ────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: execution-orchestrator
  namespace: clawbot-marketplace
  labels:
    app: execution-orchestrator
    app.kubernetes.io/part-of: clawbot-marketplace
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: execution-orchestrator
---
# ── otel-collector PDB ────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otel-collector
  namespace: clawbot-marketplace
  labels:
    app: otel-collector
    app.kubernetes.io/part-of: clawbot-marketplace
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: otel-collector
