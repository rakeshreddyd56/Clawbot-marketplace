# ─────────────────────────────────────────────────────────────────────────────
# Clawbot Marketplace — Kubernetes Secret Templates
# Namespace: clawbot-marketplace
#
# WARNING: This file contains placeholder values only!
# In production, secrets MUST be populated via:
#   - AWS Secrets Manager + Kubernetes External Secrets Operator, OR
#   - Sealed Secrets (Bitnami), OR
#   - Vault Agent Injector (HashiCorp Vault)
#
# NEVER commit real secrets. These are development scaffold stubs.
#
# To create from .env for local cluster testing (not production):
#   kubectl create secret generic clawbot-api-secrets \
#     --from-literal=SESSION_SECRET="$(cat /dev/urandom | head -c 32 | base64)" \
#     --from-literal=DATABASE_URL="postgresql://..." \
#     --from-literal=REDIS_URL="redis://..." \
#     -n clawbot-marketplace --dry-run=client -o yaml
# ─────────────────────────────────────────────────────────────────────────────

# ── API Gateway Core Secrets ──────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: clawbot-api-secrets
  namespace: clawbot-marketplace
  labels:
    app.kubernetes.io/part-of: clawbot-marketplace
    app.kubernetes.io/component: api
  annotations:
    # External Secrets Operator annotation (uncomment to use with AWS Secrets Manager)
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/clawbot-secrets-role
    description: "Core API secrets — SESSION_SECRET, DATABASE_URL, REDIS_URL"
type: Opaque
stringData:
  # ── Session ────────────────────────────────────────────────────────────────
  # REQUIRED: minimum 32 random characters. Generate with:
  #   openssl rand -hex 32
  SESSION_SECRET: "REPLACE_WITH_MIN_32_CHAR_RANDOM_STRING"

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  DATABASE_URL: "postgresql://clawbot:REPLACE_PASSWORD@postgres:5432/clawbot_marketplace"

  # ── Redis ──────────────────────────────────────────────────────────────────
  REDIS_URL: "redis://:REPLACE_REDIS_PASSWORD@redis:6379"

  # ── Header Auth (only if HEADER_AUTH_ENABLED=true) ────────────────────────
  HEADER_AUTH_SECRET: "REPLACE_WITH_MIN_32_CHAR_RANDOM_STRING"

  # ── CORS ───────────────────────────────────────────────────────────────────
  CORS_ORIGINS: "https://app.clawbot.io,https://console.clawbot.io"
---
# ── Moltbook Identity Secrets ─────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: clawbot-moltbook-secrets
  namespace: clawbot-marketplace
  labels:
    app.kubernetes.io/part-of: clawbot-marketplace
    app.kubernetes.io/component: moltbook
  annotations:
    description: "Moltbook API credentials and webhook HMAC secret"
type: Opaque
stringData:
  # ── Moltbook API Client ────────────────────────────────────────────────────
  MOLTBOOK_API_URL: "https://api.moltbook.io"
  MOLTBOOK_API_KEY: "mbk_live_REPLACE_ME"
  MOLTBOOK_AUDIENCE: "clawbot.marketplace.production"

  # ── Moltbook Webhook HMAC (TASK-HARD-014) ─────────────────────────────────
  MOLTBOOK_WEBHOOK_SECRET: "whsec_REPLACE_ME"
---
# ── Stripe Payment Secrets ────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: clawbot-stripe-secrets
  namespace: clawbot-marketplace
  labels:
    app.kubernetes.io/part-of: clawbot-marketplace
    app.kubernetes.io/component: stripe
  annotations:
    description: "Stripe Connect API key and webhook HMAC secret"
type: Opaque
stringData:
  STRIPE_API_KEY: "sk_live_REPLACE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_REPLACE_ME"
---
# ── Temporal Cloud Secrets ────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: clawbot-temporal-secrets
  namespace: clawbot-marketplace
  labels:
    app.kubernetes.io/part-of: clawbot-marketplace
    app.kubernetes.io/component: temporal
  annotations:
    description: "Temporal Cloud address and mTLS certificates"
type: Opaque
stringData:
  TEMPORAL_ADDRESS: "clawbot-marketplace.tmprl.cloud:7233"
  # TLS certificate content (PEM format, base64-encoded in production)
  # Use kubectl create secret with --from-file for cert/key
  TEMPORAL_TLS_CERT: "REPLACE_WITH_PEM_CERT"
  TEMPORAL_TLS_KEY: "REPLACE_WITH_PEM_KEY"
---
