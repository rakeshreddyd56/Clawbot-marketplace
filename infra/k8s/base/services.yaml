apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-bff
  namespace: clawbot-marketplace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway-bff
  template:
    metadata:
      labels:
        app: api-gateway-bff
        security.clawbot.io/egress: restricted
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      containers:
        - name: api
          image: ghcr.io/clawbot/api-gateway-bff:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: SERVICE_NAME
              value: api-gateway-bff
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-bff
  namespace: clawbot-marketplace
spec:
  selector:
    app: api-gateway-bff
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-console
  namespace: clawbot-marketplace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-console
  template:
    metadata:
      labels:
        app: web-console
    spec:
      containers:
        - name: web
          image: ghcr.io/clawbot/web-console:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: API_BASE_URL
              value: http://api-gateway-bff
---
apiVersion: v1
kind: Service
metadata:
  name: web-console
  namespace: clawbot-marketplace
spec:
  selector:
    app: web-console
  ports:
    - name: http
      port: 80
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-worker
  namespace: clawbot-marketplace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-worker
  template:
    metadata:
      labels:
        app: temporal-worker
        security.clawbot.io/egress: restricted
    spec:
      containers:
        - name: worker
          image: ghcr.io/clawbot/temporal-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TEMPORAL_NAMESPACE
              value: clawbot-marketplace
            - name: TEMPORAL_TASK_QUEUE
              value: clawbot-marketplace-v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-decision-service
  namespace: clawbot-marketplace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: policy-decision-service
  template:
    metadata:
      labels:
        app: policy-decision-service
        security.clawbot.io/egress: restricted
    spec:
      containers:
        - name: policy
          image: openpolicyagent/opa:0.69.0
          args:
            - run
            - --server
            - --set=services.bundle.url=http://bundle-service
          ports:
            - containerPort: 8181
---
apiVersion: v1
kind: Service
metadata:
  name: policy-decision-service
  namespace: clawbot-marketplace
spec:
  selector:
    app: policy-decision-service
  ports:
    - name: http
      port: 8181
      targetPort: 8181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-orchestrator
  namespace: clawbot-marketplace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: execution-orchestrator
  template:
    metadata:
      labels:
        app: execution-orchestrator
        security.clawbot.io/egress: restricted
    spec:
      containers:
        - name: orchestrator
          image: ghcr.io/clawbot/execution-orchestrator:latest
          env:
            - name: SANDBOX_RUNTIME
              value: gvisor
            - name: EGRESS_MODE
              value: deny-all-allowlist
