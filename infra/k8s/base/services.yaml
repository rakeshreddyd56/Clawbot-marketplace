# ─────────────────────────────────────────────
# Clawbot Marketplace — Kubernetes Deployments + Services
# Namespace: clawbot-marketplace
# Registry:  ghcr.io/clawbot/
# ─────────────────────────────────────────────

# ── ServiceAccount ────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clawbot-workload
  namespace: clawbot-marketplace
  labels:
    app.kubernetes.io/part-of: clawbot-marketplace
automountServiceAccountToken: false
---
# ── api-gateway-bff Deployment ────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-bff
  namespace: clawbot-marketplace
  labels:
    app: api-gateway-bff
    app.kubernetes.io/name: api-gateway-bff
    app.kubernetes.io/part-of: clawbot-marketplace
    app.kubernetes.io/version: "latest"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: api-gateway-bff
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api-gateway-bff
        security.clawbot.io/egress: restricted
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: clawbot-workload
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/clawbot/api-gateway-bff:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: SERVICE_NAME
              value: api-gateway-bff
            - name: PORT
              value: "3000"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: api-gateway-bff
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: clawbot-api-secrets
                  key: SESSION_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clawbot-api-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: clawbot-api-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-bff
  namespace: clawbot-marketplace
  labels:
    app: api-gateway-bff
    app.kubernetes.io/part-of: clawbot-marketplace
spec:
  selector:
    app: api-gateway-bff
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# ── web-console Deployment ────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-console
  namespace: clawbot-marketplace
  labels:
    app: web-console
    app.kubernetes.io/name: web-console
    app.kubernetes.io/part-of: clawbot-marketplace
    app.kubernetes.io/version: "latest"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: web-console
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: web-console
        security.clawbot.io/egress: restricted
    spec:
      serviceAccountName: clawbot-workload
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/clawbot/web-console:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: API_BASE_URL
              value: http://api-gateway-bff
            - name: OTEL_SERVICE_NAME
              value: web-console
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web-console
  namespace: clawbot-marketplace
  labels:
    app: web-console
    app.kubernetes.io/part-of: clawbot-marketplace
spec:
  selector:
    app: web-console
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# ── temporal-worker Deployment ────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-worker
  namespace: clawbot-marketplace
  labels:
    app: temporal-worker
    app.kubernetes.io/name: temporal-worker
    app.kubernetes.io/part-of: clawbot-marketplace
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: temporal-worker
  template:
    metadata:
      labels:
        app: temporal-worker
        security.clawbot.io/egress: restricted
    spec:
      serviceAccountName: clawbot-workload
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/clawbot/temporal-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: TEMPORAL_NAMESPACE
              value: clawbot-marketplace
            - name: TEMPORAL_TASK_QUEUE
              value: clawbot-marketplace-v1
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: temporal-worker
            - name: API_BASE_URL
              value: "http://api-gateway-bff"
            - name: TEMPORAL_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: clawbot-temporal-secrets
                  key: TEMPORAL_ADDRESS
            - name: TEMPORAL_TLS_CERT
              valueFrom:
                secretKeyRef:
                  name: clawbot-temporal-secrets
                  key: TEMPORAL_TLS_CERT
                  optional: true
            - name: TEMPORAL_TLS_KEY
              valueFrom:
                secretKeyRef:
                  name: clawbot-temporal-secrets
                  key: TEMPORAL_TLS_KEY
                  optional: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "process.exit(0)"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# ── policy-decision-service (OPA) Deployment ─
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-decision-service
  namespace: clawbot-marketplace
  labels:
    app: policy-decision-service
    app.kubernetes.io/name: policy-decision-service
    app.kubernetes.io/part-of: clawbot-marketplace
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: policy-decision-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: policy-decision-service
        security.clawbot.io/egress: restricted
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8181"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: clawbot-workload
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opa
          image: openpolicyagent/opa:0.69.0-rootless
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --diagnostic-addr=0.0.0.0:8282
            - --log-format=json
            - --set=services.bundle.url=http://bundle-service
            - /policies/marketplace.rego
          ports:
            - name: http
              containerPort: 8181
              protocol: TCP
            - name: diag
              containerPort: 8282
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: diag
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health?bundle=true
              port: diag
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
            - name: opa-data
              mountPath: /data
      volumes:
        - name: policies
          configMap:
            name: opa-policy-bundle
        - name: opa-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: policy-decision-service
  namespace: clawbot-marketplace
  labels:
    app: policy-decision-service
    app.kubernetes.io/part-of: clawbot-marketplace
spec:
  selector:
    app: policy-decision-service
  ports:
    - name: http
      port: 8181
      targetPort: http
      protocol: TCP
    - name: diag
      port: 8282
      targetPort: diag
      protocol: TCP
---
# ── OPA Policy ConfigMap ──────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policy-bundle
  namespace: clawbot-marketplace
  labels:
    app.kubernetes.io/part-of: clawbot-marketplace
data:
  marketplace.rego: |
    # Loaded from policies/marketplace.rego — see infra/k8s/base/kustomization.yaml
    # The actual policy is applied via a Kustomize configMapGenerator in production.
    # This stub satisfies OPA startup.
    package clawbot.marketplace
    default allow := false
---
# ── execution-orchestrator Deployment ─────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-orchestrator
  namespace: clawbot-marketplace
  labels:
    app: execution-orchestrator
    app.kubernetes.io/name: execution-orchestrator
    app.kubernetes.io/part-of: clawbot-marketplace
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: execution-orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: execution-orchestrator
        security.clawbot.io/egress: restricted
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: clawbot-workload
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: ghcr.io/clawbot/execution-orchestrator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: SANDBOX_RUNTIME
              value: gvisor
            - name: EGRESS_MODE
              value: deny-all-allowlist
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: execution-orchestrator
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: execution-orchestrator
  namespace: clawbot-marketplace
  labels:
    app: execution-orchestrator
    app.kubernetes.io/part-of: clawbot-marketplace
spec:
  selector:
    app: execution-orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
